# nginx para la SPA de React.
#  1) Sirve los archivos estáticos generados por Vite.
#  2) Fallback de rutas: /products, /sales/new... no existen como archivos; se responde index.html
#     y React Router resuelve la ruta en el navegador (sin esto, recargar /products daría 404).
#  3) Proxy inverso de /api -> contenedor de la API: el navegador habla con UN solo origen (sin CORS).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión de texto (JS, CSS, JSON)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cabeceras de seguridad básicas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: "api" es el nombre del servicio en docker-compose (DNS interno de Docker)
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos con hash en el nombre (index-Cu_MbJaY.js): cambian de nombre en cada build -> caché de 1 año
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html nunca se cachea: así el navegador siempre descubre los nuevos /assets tras un despliegue
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    # Fallback de la SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
