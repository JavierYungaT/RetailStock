# Integración continua: en cada push y pull request a main compila y prueba el backend,
# compila el frontend y construye las imágenes Docker (sin publicarlas).
# Equivalente en Java: un workflow con "mvn verify" + "npm ci && npm run build" + "docker build".

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio: el workflow solo lee el repositorio
permissions:
  contents: read

# Si llega un push nuevo a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: .NET · restore, build y test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore RetailStock.sln

      - name: Build
        run: dotnet build RetailStock.sln --configuration Release --no-restore

      # Las pruebas no necesitan base de datos (mocks + EF InMemory)
      - name: Test (con cobertura)
        run: >
          dotnet test RetailStock.sln --configuration Release --no-build
          --settings tests/coverage.runsettings
          --results-directory TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Publicar resultados y cobertura
        if: always() # también cuando fallan las pruebas: es cuando más se necesitan
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  frontend:
    name: React · lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: retailstock-front
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: retailstock-front/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (incluye chequeo de tipos)
        run: npm run build

  docker:
    name: Docker · build de imágenes
    runs-on: ubuntu-latest
    needs: [backend, frontend] # solo si compila y pasan las pruebas
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Imagen de la API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/RetailStock.Api/Dockerfile
          push: false
          tags: retailstock-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Imagen del front
        uses: docker/build-push-action@v6
        with:
          context: retailstock-front
          push: false
          tags: retailstock-front:ci
          cache-from: type=gha,scope=front
          cache-to: type=gha,scope=front,mode=max
